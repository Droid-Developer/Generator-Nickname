<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nickname Generator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app-wrapper">
    <header class="app-header">
        <div class="header-top">
            <h1 id="txt-title">Генератор никнеймов</h1>
            <button class="theme-toggle" onclick="App.toggleTheme()" aria-label="Toggle theme">
                <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
        
        <nav class="tab-bar">
            <button class="tab-btn active" onclick="App.switchTab('main')" id="tab-main">Генератор</button>
            <button class="tab-btn" onclick="App.switchTab('settings')" id="tab-settings">Настройки</button>
        </nav>
    </header>

    <main class="container">
        
        <section id="view-main" class="tab-view active">
            <div class="output-section">
                <div id="result" class="result-box">---</div>
            </div>

            <div class="quick-actions">
                <button onclick="App.copyResult(this)" class="btn-secondary" id="btn-copy">Копировать</button>
                <button onclick="App.clearHistory()" class="btn-icon-clear" title="Clear History">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
            </div>

            <div class="history-section">
                <h3 id="txt-history-title">История (нажмите для копирования)</h3>
                <div id="history" class="history-box"></div>
            </div>
        </section>

        <section id="view-settings" class="tab-view">
            <div class="settings-grid">
                <div class="input-group full-width">
                    <label for="lang-select" id="lbl-lang">Язык приложения</label>
                    <select id="lang-select" onchange="App.changeLanguage(this.value)">
                        <option value="ru">Русский</option>
                        <option value="en">English</option>
                        <option value="zh">简体中文</option>
                        <option value="ar">العربية</option>
                        <option value="ja">日本語</option>
                        <option value="ko">한국어</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="length" id="lbl-length">Длина</label>
                    <input type="number" id="length" value="8" min="3" max="20">
                </div>

                <div class="input-group">
                    <label for="count" id="lbl-count">Количество</label>
                    <input type="number" id="count" value="1" min="1" max="20">
                </div>

                <div class="input-group full-width">
                    <label for="mode" id="lbl-mode">Режим генерации</label>
                    <select id="mode">
                        <option value="readable" id="opt-readable">Читаемый (чередование)</option>
                        <option value="random" id="opt-random">Полный рандом</option>
                        <option value="vowelHeavy" id="opt-vowel">Больше гласных</option>
                        <option value="consonantHeavy" id="opt-consonant">Больше согласных</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="prefix" id="lbl-prefix">Префикс</label>
                    <input type="text" id="prefix" placeholder="x_">
                </div>

                <div class="input-group">
                    <label for="suffix" id="lbl-suffix">Суффикс</label>
                    <input type="text" id="suffix" placeholder="_pro">
                </div>

                <div class="input-group full-width">
                    <label for="exclude" id="lbl-exclude">Исключить буквы</label>
                    <input type="text" id="exclude" placeholder="abc">
                </div>
            </div>

            <div class="options">
                <label class="checkbox-container">
                    <input type="checkbox" id="numbers" checked> 
                    <span class="checkmark"></span> <span id="chk-digits">Добавлять цифры</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="upperFirst" checked> 
                    <span class="checkmark"></span> <span id="chk-upperfirst">Заглавная первая буква</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="upperAll"> 
                    <span class="checkmark"></span> <span id="chk-caps">ВCЕ БУКВЫ CAPS</span>
                </label>
                <label class="checkbox-container">
                    <input type="checkbox" id="noRepeat"> 
                    <span class="checkmark"></span> <span id="chk-norepeat">Без повторов подряд</span>
                </label>
            </div>
        </section>
    </main>

    <div class="sticky-action-trigger">
        <button onclick="App.generate()" class="btn-primary" id="btn-generate">СГЕНЕРИРОВАТЬ</button>
    </div>

    <footer class="app-footer">
        <p id="txt-footer">С Любовью от Mind</p>
    </footer>
</div>

<script src="./script.js"></script>
</body>
</html>
